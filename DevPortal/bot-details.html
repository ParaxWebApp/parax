<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Details — Parax</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
  <style>
    .bot-details-container { padding: 40px 24px; max-width: 800px; margin: 0 auto; }
    .card { background: var(--bg-secondary); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 24px; }
    .token-box { background: #0f172a; padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); color: var(--text-primary); font-family: monospace; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; overflow-wrap: anywhere; }
    .token-box.secret { border-color: var(--error); color: var(--error); }
    .warning { color: var(--error); font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; }
    #err { display: none; background: rgba(229,72,77,0.12); border: 1px solid var(--error); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; font-size: 0.88rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand" onclick="window.location.href='/'">Parax</div>
  </nav>

  <div class="bot-details-container">
    <div id="err"></div>
    <div class="card">
        <h1>Bot Details / Bot Detayları</h1>

        <div class="form-group">
            <label>Bot Name / Bot Adı</label>
            <input type="text" id="f-name" disabled />
        </div>

        <div class="form-group">
            <label>Client ID / İstemci Kimliği</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="f-client" disabled />
                <button class="btn btn-secondary" id="btn-copy-client">Copy / Kopyala</button>
            </div>
        </div>

        <div class="form-group">
            <label>Scopes / Kapsamlar</label>
            <input type="text" id="f-scopes" disabled />
        </div>

        <div class="form-group">
            <label>Bot Token / Bot Jetonu</label>
            <div class="warning">Never share your token! / Jetonunuzu asla paylaşmayın! Jeton yalnızca oluşturma ve yenilemede bir kez gösterilir.</div>
            <div class="token-box" id="token-box">
                <code id="bot-token">gizli — görmek için yenile / hidden until regenerate</code>
                <button class="btn btn-primary" id="btn-copy-token">Copy / Kopyala</button>
            </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="window.location.href='bots.html'">Back / Geri</button>
            <button class="btn btn-primary" id="btn-regen" style="background:var(--accent)">Regenerate Token / Jetonu Yenile</button>
            <button class="btn btn-secondary" id="btn-del" style="color:var(--error)">Delete / Sil</button>
        </div>
    </div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBi6UCjNt6RxB-RrKmDSHuC3Ax9khqzcbg",
      authDomain: "webappparax.firebaseapp.com",
      projectId: "webappparax"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var botId = new URLSearchParams(window.location.search).get("id");

    // Standalone mode: set window.DEVPORTAL = { api: "https://main-host", login: "https://main-host/login.html" }
    var PORTAL = window.DEVPORTAL || {};
    var API_BASE = PORTAL.api || "";
    var LOGIN_URL = PORTAL.login || "/login.html";

    function showErr(msg) {
      var el = document.getElementById("err");
      el.textContent = msg;
      el.style.display = "block";
    }
    function apiErr(data, status) {
      return (data && data.error ? data.error : "HTTP " + status) +
        (data && data.code !== undefined ? " (Oddiss " + data.code + ")" : "");
    }
    async function api(path, method, body) {
      var user = auth.currentUser;
      if (!user) { window.location.href = LOGIN_URL; throw new Error("auth"); }
      var token = await user.getIdToken();
      var res = await fetch(API_BASE + path, {
        method: method || "GET",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: body ? JSON.stringify(body) : undefined
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(apiErr(data, res.status));
      return data;
    }

    async function boot() {
      if (!botId) { showErr("Bot bulunamadı (id yok). / Missing bot id."); return; }
      try {
        var data = await api("/api/bots/");
        var bots = data.bots || [];
        var bot = null;
        for (var i = 0; i < bots.length; i++) {
          if (bots[i].id === botId) { bot = bots[i]; break; }
        }
        if (!bot) { showErr("Bot bulunamadı veya sana ait değil. (Oddiss 212)"); return; }
        document.getElementById("f-name").value = bot.name || "";
        document.getElementById("f-client").value = bot.clientId || "";
        document.getElementById("f-scopes").value = (bot.scopes || []).join(", ");
      } catch (e) {
        if (e.message !== "auth") showErr(e.message);
      }
    }

    document.getElementById("btn-copy-client").addEventListener("click", function () {
      navigator.clipboard.writeText(document.getElementById("f-client").value);
      alert("Copied! / Kopyalandı!");
    });
    document.getElementById("btn-copy-token").addEventListener("click", function () {
      navigator.clipboard.writeText(document.getElementById("bot-token").textContent);
      alert("Copied! / Kopyalandı!");
    });
    document.getElementById("btn-regen").addEventListener("click", async function () {
      if (!confirm("Jeton yenilensin mi? Eskisi ölür. / Regenerate? The old token dies.")) return;
      try {
        var r = await api("/api/bots/" + encodeURIComponent(botId) + "/regenerate", "POST");
        var box = document.getElementById("token-box");
        box.classList.add("secret");
        document.getElementById("bot-token").textContent = r.botToken;
      } catch (e) { showErr(e.message); }
    });
    document.getElementById("btn-del").addEventListener("click", async function () {
      if (!confirm("Bot silinsin mi? / Delete this bot?")) return;
      try {
        await api("/api/bots/" + encodeURIComponent(botId), "DELETE");
        window.location.href = "bots.html";
      } catch (e) { showErr(e.message); }
    });

    auth.onAuthStateChanged(function (u) {
      if (!u) window.location.href = LOGIN_URL;
      else boot();
    });
  </script>
</body>
</html>
