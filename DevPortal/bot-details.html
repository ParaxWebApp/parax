<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Details — Parax</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .bot-details-container { padding: 40px 24px; max-width: 800px; margin: 0 auto; }
    .card { background: var(--bg-secondary); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 24px; }
    .token-box { background: #0f172a; padding: 16px; border-radius: var(--radius); border: 1px solid var(--error); color: var(--error); font-family: monospace; display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .warning { color: var(--error); font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand" onclick="window.location.href='/'">Parax</div>
  </nav>

  <div class="bot-details-container">
    <div class="card">
        <h1>Bot Details / Bot Detayları</h1>
        
        <div class="form-group">
            <label>Bot Name / Bot Adı</label>
            <input type="text" value="ModeratorBot" disabled />
        </div>

        <div class="form-group">
            <label>Client ID / İstemci Kimliği</label>
            <div style="display:flex; gap:8px;">
                <input type="text" value="98273465192837465" disabled />
                <button class="btn btn-secondary" onclick="copyToClipboard('98273465192837465')">Copy / Kopyala</button>
            </div>
        </div>

        <div class="form-group">
            <label>Bot Token / Bot Jetonu</label>
            <div class="warning">⚠️ Never share your token! / Jetonunuzu asla paylaşmayın!</div>
            <div class="token-box">
                <code id="bot-token">PRX_v1.7a92bc3f4d8e9a1b2c3d4e5f6g7h8i9j</code>
                <button class="btn btn-primary" onclick="copyToClipboard(document.getElementById('bot-token').textContent)">Copy / Kopyala</button>
            </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 32px;">
            <button class="btn btn-secondary" onclick="window.location.href='bots.html'">Back / Geri</button>
            <button class="btn btn-primary" style="background:var(--accent)">Regenerate Token / Jetonu Yenile</button>
        </div>
    </div>
  </div>

  <script>
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      alert('Copied to clipboard! / Panoya kopyalandı!');
    }
  </script>
</body>
</html>
