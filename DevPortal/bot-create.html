<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register New Bot — Parax</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
  <style>
    .bot-create-container { padding: 40px 24px; max-width: 800px; margin: 0 auto; }
    .card { background: var(--bg-secondary); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); }
    .form-group { margin-bottom: 24px; }
    .perm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
    .perm-item { background: var(--bg-tertiary); padding: 10px; border-radius: var(--radius); display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .perm-item input { accent-color: var(--brand); cursor: pointer; }
    #err { display: none; background: rgba(229,72,77,0.12); border: 1px solid var(--error); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; font-size: 0.88rem; }
    #result { display: none; }
    #result code { display: block; background: #0f172a; color: var(--error); font-family: monospace; padding: 14px; border-radius: var(--radius); border: 1px solid var(--error); margin: 8px 0 16px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand" onclick="window.location.href='/'">Parax</div>
  </nav>

  <div class="bot-create-container">
    <div class="card" id="form-card">
        <h1>Register New Bot / Yeni Bot Kaydet</h1>
        <p class="subtitle" style="margin-bottom: 32px;">Configure your bot's identity and capabilities.</p>
        <div id="err"></div>

        <form id="bot-create-form">
            <div class="form-group">
                <label for="bot-name">Bot Name / Bot Adı</label>
                <input type="text" id="bot-name" placeholder="My Awesome Bot" required maxlength="50" />
            </div>

            <div class="form-group">
                <label for="bot-desc">Description / Açıklama</label>
                <textarea id="bot-desc" rows="3" placeholder="Explain what your bot does..." maxlength="500"></textarea>
            </div>

            <div class="form-group">
                <label>Scopes & Permissions / Kapsam ve İzinler</label>
                <div class="perm-grid">
                    <label class="perm-item"><input type="checkbox" name="perm" value="read" checked> Read Messages / Mesajları Oku</label>
                    <label class="perm-item"><input type="checkbox" name="perm" value="send" checked> Send Messages / Mesaj Gönder</label>
                    <label class="perm-item"><input type="checkbox" name="perm" value="kick"> Kick Members / Üyeleri At</label>
                    <label class="perm-item"><input type="checkbox" name="perm" value="ban"> Ban Members / Üyeleri Yasakla</label>
                    <label class="perm-item"><input type="checkbox" name="perm" value="connect"> Connect Voice / Sesli Bağlan</label>
                    <label class="perm-item"><input type="checkbox" name="perm" value="speak"> Speak / Konuş</label>
                    <label class="perm-item"><input type="checkbox" name="perm" value="manage_roles"> Manage Roles / Rolleri Yönet</label>
                    <label class="perm-item"><input type="checkbox" name="perm" value="manage_channels"> Manage Channels / Kanalları Yönet</label>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 32px;">
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel / İptal</button>
                <button type="submit" class="btn btn-primary" id="submit-btn">Register Bot / Botu Kaydet</button>
            </div>
        </form>
    </div>

    <div class="card" id="result">
        <h1>Bot oluşturuldu!</h1>
        <p class="subtitle">Jeton <b>bir kez</b> gösterilir — hemen kopyala. Bir daha göremezsin.</p>
        <label>Client ID</label>
        <code id="res-client"></code>
        <label>Bot Token</label>
        <code id="res-token"></code>
        <div style="display: flex; gap: 12px; margin-top: 8px;">
            <button class="btn btn-secondary" id="res-copy">Copy Token / Kopyala</button>
            <button class="btn btn-primary" id="res-done">Done / Tamam</button>
        </div>
    </div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBi6UCjNt6RxB-RrKmDSHuC3Ax9khqzcbg",
      authDomain: "webappparax.firebaseapp.com",
      projectId: "webappparax"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();

    // Standalone mode: set window.DEVPORTAL = { api: "https://main-host", login: "https://main-host/login.html" }
    var PORTAL = window.DEVPORTAL || {};
    var API_BASE = PORTAL.api || "";
    var LOGIN_URL = PORTAL.login || "/login.html";

    function showErr(msg) {
      var el = document.getElementById("err");
      el.textContent = msg;
      el.style.display = "block";
    }

    auth.onAuthStateChanged(function (u) {
      if (!u) window.location.href = LOGIN_URL;
    });

    document.getElementById("bot-create-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var btn = document.getElementById("submit-btn");
      btn.disabled = true;
      try {
        var user = auth.currentUser;
        if (!user) { window.location.href = LOGIN_URL; return; }
        var token = await user.getIdToken();
        var scopes = Array.prototype.map.call(
          document.querySelectorAll('input[name="perm"]:checked'),
          function (el) { return el.value; }
        );
        var res = await fetch(API_BASE + "/api/bots/register", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({
            name: document.getElementById("bot-name").value.trim(),
            description: document.getElementById("bot-desc").value.trim(),
            scopes: scopes
          })
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error((data.error || ("HTTP " + res.status)) + (data.code !== undefined ? " (Oddiss " + data.code + ")" : ""));
        document.getElementById("res-client").textContent = data.clientId;
        document.getElementById("res-token").textContent = data.botToken;
        document.getElementById("form-card").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("res-done").onclick = function () {
          window.location.href = "bot-details.html?id=" + encodeURIComponent(data.id);
        };
      } catch (err) {
        showErr(err.message);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("res-copy").addEventListener("click", function () {
      navigator.clipboard.writeText(document.getElementById("res-token").textContent);
      alert("Copied! / Kopyalandı!");
    });
  </script>
</body>
</html>
