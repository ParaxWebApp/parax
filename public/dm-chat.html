<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direct Message — Parax</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
  <script src="para.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand" onclick="window.location.href='/dashboard.html'">Parax</div>
    <div class="navbar-links">
        <a href="friends.html">Friends</a>
        <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <div class="chat-wrapper" style="display:flex; flex-direction:column; height: calc(100vh - 60px);">
    <div class="chat-header" style="padding:15px; background:var(--background-secondary); border-bottom:1px solid var(--border-color);">
      <h2 id="dm-recipient-name">Direct Message</h2>
    </div>
    <div id="dm-messages" class="chat-messages" style="flex:1; overflow-y:auto; padding:20px;">
      <div class="chat-loading">Loading conversation...</div>
    </div>
    <div class="chat-input-area" style="padding:15px; background:var(--background-secondary); display:flex; gap:10px;">
      <input type="text" id="dm-message-input" placeholder="Type a message..." autocomplete="off" style="flex:1; padding:10px; border-radius:4px; border:1px solid var(--border-color); background:var(--background-primary); color:var(--text-color);" />
      <button id="dm-send-btn" class="btn btn-primary">Send</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
